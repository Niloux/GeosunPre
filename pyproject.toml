[project]
name = "geosunpre"
version = "0.2.0"
description = "Production Geosun dual-fisheye and LAS preprocessing for 3DGS"
readme = "README.md"
authors = [
    { name = "Niloux3d", email = "15072763003@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "opencv-python>=4.12,<5",
    "pillow>=12",
    "pycolmap==4.2.0",
    "pyceres==2.6",
    "geosunpre-native==0.1.0",
    "scipy>=1.15",
    "transformers==4.57.6",
    "lomatch @ git+https://github.com/davnords/LoMa.git@8fb59c458f2a2ef44314f462467b229c27786bf0",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "psutil>=7,<8; sys_platform == 'win32'",
]

[project.scripts]
geosunpre = "geosunpre:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "run.sh", "run.ps1", "run-reference.ps1", "setup-windows.ps1", "setup-native.ps1", "package-native.ps1",
    "scripts/**", "configs/**", "docs/**",
    "native/pyproject.toml", "native/setup.py", "native/MANIFEST.in",
    "native/*.cpp", "native/*.h", "native/*.md", "native/vendor/**",
    "native/cpp/**",
]

[tool.uv.sources]
geosunpre-native = { path = "native" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu128"
explicit = true

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
